<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>統測農業概論第7章園藝(90-115學年)</title>
    <!-- Tailwind CSS v3 官方穩定版 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col text-slate-800">

    <!-- 頂部導覽列 -->
    <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center">
            <h1 class="text-lg md:text-xl font-bold tracking-wide">
                <strong>統測農業概論第7章園藝(90-115學年)</strong>
            </h1>
            <div id="timer-container" class="hidden items-center bg-emerald-800 px-3 py-1 rounded-full text-sm font-medium shadow-inner mt-1 sm:mt-0">
                <svg class="w-4 h-4 mr-1.5 animate-pulse text-emerald-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                作答時間：<span id="timer" class="font-mono ml-1">00:00</span>
            </div>
        </div>
    </header>

    <!-- 主容器 -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 sm:p-6 my-auto">

        <!-- 1. 設定畫面 -->
        <section id="setup-screen" class="bg-white rounded-2xl shadow-xl border border-slate-100 p-6 md:p-8 transition-all duration-300">
            <div class="flex items-center space-x-3 mb-6 pb-4 border-b border-slate-100">
                <div class="p-2.5 bg-emerald-50 text-emerald-600 rounded-xl">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-slate-800">測驗參數設定</h2>
                    <p class="text-sm text-slate-500">自訂題數與出題模式，開始您的實力演練</p>
                </div>
            </div>

            <!-- 選擇題數 -->
            <div class="mb-6">
                <label class="block text-sm font-semibold text-slate-700 mb-3">選擇測驗題數（總分滿分100分）：</label>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <label class="flex items-center justify-center p-3.5 border-2 rounded-xl cursor-pointer transition-all border-emerald-500 bg-emerald-50/50 text-emerald-800 font-medium select-none radio-card-count">
                        <input type="radio" name="question-count" value="20" class="sr-only" checked>
                        <span>20 題</span>
                    </label>
                    <label class="flex items-center justify-center p-3.5 border-2 rounded-xl cursor-pointer transition-all border-slate-200 hover:border-slate-300 text-slate-700 font-medium select-none radio-card-count">
                        <input type="radio" name="question-count" value="40" class="sr-only">
                        <span>40 題</span>
                    </label>
                    <label class="flex items-center justify-center p-3.5 border-2 rounded-xl cursor-pointer transition-all border-slate-200 hover:border-slate-300 text-slate-700 font-medium select-none radio-card-count">
                        <input type="radio" name="question-count" value="50" class="sr-only">
                        <span>50 題</span>
                    </label>
                    <label class="flex items-center justify-center p-3.5 border-2 rounded-xl cursor-pointer transition-all border-slate-200 hover:border-slate-300 text-slate-700 font-medium select-none radio-card-count">
                        <input type="radio" name="question-count" value="all" class="sr-only">
                        <span>全部測驗 (65題)</span>
                    </label>
                </div>
            </div>

            <!-- 出題順序模式 -->
            <div class="mb-8">
                <label class="block text-sm font-semibold text-slate-700 mb-3">出題順序模式：</label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <label class="flex items-center p-4 border-2 rounded-xl cursor-pointer transition-all border-emerald-500 bg-emerald-50/50 text-emerald-800 font-medium select-none radio-card-mode">
                        <input type="radio" name="question-mode" value="random" class="sr-only" checked>
                        <div class="flex items-center space-x-3">
                            <span class="text-xl">🔀</span>
                            <div>
                                <div class="font-bold">隨機選題</div>
                                <div class="text-xs text-slate-500 font-normal">每次抽題與選項順序皆隨機打亂</div>
                            </div>
                        </div>
                    </label>
                    <label class="flex items-center p-4 border-2 rounded-xl cursor-pointer transition-all border-slate-200 hover:border-slate-300 text-slate-700 font-medium select-none radio-card-mode">
                        <input type="radio" name="question-mode" value="sequential" class="sr-only">
                        <div class="flex items-center space-x-3">
                            <span class="text-xl">🔢</span>
                            <div>
                                <div class="font-bold">依題號順序選題</div>
                                <div class="text-xs text-slate-500 font-normal">按照題庫原始編號循序漸進測驗</div>
                            </div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- 開始按鈕 -->
            <button onclick="startQuiz()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 transition-all transform active:scale-[0.99] flex items-center justify-center space-x-2 text-lg">
                <span>🚀 開始測驗</span>
            </button>
        </section>

        <!-- 2. 測驗進行畫面 -->
        <section id="quiz-screen" class="hidden space-y-6">
            <!-- 進度與導航列 -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-wrap justify-between items-center gap-4">
                <div class="flex items-center space-x-2">
                    <span id="current-q-badge" class="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full font-bold text-sm">第 1 題</span>
                    <span class="text-slate-400 text-sm">/ 共 <span id="total-q-count">20</span> 題</span>
                </div>
                <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-emerald-500 h-full transition-all duration-300" style="width: 5%"></div>
                </div>
            </div>

            <!-- 題目卡片 -->
            <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-6 md:p-8 space-y-6">
                <div id="question-text" class="text-lg md:text-xl font-bold text-slate-900 leading-relaxed">
                    <!-- 題目內容載入處 -->
                </div>

                <!-- 選項清單 -->
                <div id="options-container" class="space-y-3">
                    <!-- 選項載入處 -->
                </div>

                <!-- 即時回饋與解析區 -->
                <div id="feedback-container" class="hidden mt-6 p-5 rounded-xl border transition-all">
                    <!-- 回饋內容 -->
                </div>
            </div>

            <!-- 底部操作列 -->
            <div class="flex justify-between items-center pt-2">
                <button id="prev-btn" onclick="prevQuestion()" class="px-5 py-2.5 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold rounded-xl shadow-sm transition-all disabled:opacity-40 disabled:cursor-not-allowed">
                    上一題
                </button>
                <div class="flex space-x-3">
                    <button id="next-btn" onclick="nextQuestion()" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-md transition-all">
                        下一題
                    </button>
                    <button id="submit-btn" onclick="confirmSubmit()" class="hidden px-6 py-2.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl shadow-md transition-all">
                        交卷看結果
                    </button>
                </div>
            </div>
        </section>

        <!-- 3. 結果與錯題大鍋菜畫面 -->
        <section id="result-screen" class="hidden space-y-6">
            <!-- 成績總結大卡片 -->
            <div class="bg-gradient-to-br from-emerald-600 to-teal-700 rounded-3xl shadow-2xl text-white p-8 text-center relative overflow-hidden">
                <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
                <h2 class="text-2xl font-bold mb-2">🎉 測驗圓滿完成！</h2>
                <p class="text-emerald-100 text-sm mb-6">以下是您的本次測驗表現成績單</p>
                
                <div class="inline-flex items-baseline justify-center bg-white/10 backdrop-blur-md px-8 py-4 rounded-2xl border border-white/20 mb-6">
                    <span id="final-score" class="text-6xl font-black tracking-tight">85</span>
                    <span class="text-xl ml-2 text-emerald-100 font-semibold">分</span>
                </div>

                <div class="grid grid-cols-3 gap-4 max-w-md mx-auto text-center border-t border-white/15 pt-6">
                    <div>
                        <div class="text-xs text-emerald-200 mb-1">答對題數</div>
                        <div id="correct-count-text" class="text-xl font-bold">17 / 20</div>
                    </div>
                    <div>
                        <div class="text-xs text-emerald-200 mb-1">正確率</div>
                        <div id="accuracy-rate-text" class="text-xl font-bold">85%</div>
                    </div>
                    <div>
                        <div class="text-xs text-emerald-200 mb-1">總花費時間</div>
                        <div id="total-time-text" class="text-xl font-bold">02:15</div>
                    </div>
                </div>
            </div>

            <!-- 操作按鈕 -->
            <div class="flex flex-col sm:flex-row gap-3">
                <button onclick="restartQuiz()" class="flex-1 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center space-x-2">
                    <span>🔄 重新測驗 / 返回設定</span>
                </button>
                <button onclick="scrollToMistakes()" id="view-mistakes-btn" class="py-3.5 px-6 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold rounded-xl shadow-sm transition-all flex items-center justify-center space-x-2">
                    <span>查看錯題詳解彙整 👇</span>
                </button>
            </div>

            <!-- 錯題大鍋菜專區 -->
            <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-6 md:p-8 space-y-6">
                <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                    <div class="flex items-center space-x-3">
                        <div class="p-2.5 bg-red-50 text-red-600 rounded-xl">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-slate-800">錯題大鍋菜彙整</h3>
                            <p class="text-sm text-slate-500">詳細列出答錯與未作答題目，並附上農概課本詳盡解析</p>
                        </div>
                    </div>
                    <span id="mistake-badge" class="px-3 py-1 bg-red-100 text-red-700 font-bold rounded-full text-sm">錯題數：0</span>
                </div>

                <div id="mistakes-container" class="space-y-6">
                    <!-- 錯題動態載入處 -->
                </div>
            </div>
        </section>

    </main>

    <!-- 底部版權 -->
    <footer class="text-center py-6 text-xs text-slate-400">
        統測農業概論線上測驗系統 &copy; 2026 Crafted for Vocational Students
    </footer>

        document.querySelectorAll('input[name="question-count"]').forEach(radio => {

        // 開始測驗
        function startQuiz() {
            const countVal = document.querySelector('input[name="question-count"]:checked').value;
            const modeVal = document.querySelector('input[name="question-mode"]:checked').value;

            // 決定題數
            let targetCount = fullQuestionBank.length;
            if (countVal !== 'all') {
                targetCount = parseInt(countVal);
            }

            // 複製題庫
            let pool = [...fullQuestionBank];

            // 模式處理
            if (modeVal === 'random') {
                pool.sort(() => Math.random() - 0.5);
            }

            // 取出指定題數
            quizState.questions = pool.slice(0, Math.min(targetCount, pool.length));
            quizState.currentIndex = 0;
            quizState.userAnswers = {};
            quizState.isSubmitted = false;
            quizState.elapsedSeconds = 0;

            // 切換畫面
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('timer-container').classList.remove('hidden');
            document.getElementById('timer-container').classList.add('flex');

            // 啟動計時器
            if (quizState.timerInterval) clearInterval(quizState.timerInterval);
            quizState.startTime = Date.now();
            quizState.timerInterval = setInterval(updateTimer, 1000);

            renderQuestion();
        }

        // 計時器更新
        function updateTimer() {
            quizState.elapsedSeconds = Math.floor((Date.now() - quizState.startTime) / 1000);
            const mins = String(Math.floor(quizState.elapsedSeconds / 60)).padStart(2, '0');
            const secs = String(quizState.elapsedSeconds % 60).padStart(2, '0');
            document.getElementById('timer').textContent = `${mins}:${secs}`;
        }

        // 渲染題目
        function renderQuestion() {
            const q = quizState.questions[quizState.currentIndex];
            const total = quizState.questions.length;

            // 進度與標籤
            document.getElementById('current-q-badge').textContent = `第 ${quizState.currentIndex + 1} 題`;
            document.getElementById('total-q-count').textContent = total;
            document.getElementById('progress-bar').style.width = `${((quizState.currentIndex + 1) / total) * 100}%`;

            // 題目文字
            document.getElementById('question-text').textContent = `${quizState.currentIndex + 1}. ${q.question}`;

            // 選項渲染
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const userAns = quizState.userAnswers[quizState.currentIndex];

            Object.entries(q.options).forEach(([key, val]) => {
                const isSelected = userAns === key;
                let btnClass = "w-full text-left p-4 rounded-xl border-2 transition-all flex items-center justify-between ";

                if (userAns !== undefined) {
                    // 已作答狀態：顯示對錯
                    if (key === q.answer) {
                        btnClass += "border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold shadow-sm";
                    } else if (isSelected && key !== q.answer) {
                        btnClass += "border-red-400 bg-red-50 text-red-900 font-semibold shadow-sm";
                    } else {
                        btnClass += "border-slate-200 bg-white text-slate-600 opacity-60";
                    }
                } else {
                    // 未作答狀態：絕對乾淨，無任何高亮或綠色標示
                    btnClass += "border-slate-200 hover:border-emerald-300 hover:bg-slate-50 bg-white text-slate-700 cursor-pointer shadow-sm";
                }

                const btn = document.createElement('button');
                btn.className = btnClass;
                btn.disabled = userAns !== undefined;
                
                let extraBadge = '';
                if (userAns !== undefined) {
                    if (key === q.answer) {
                        extraBadge = '<span class="text-emerald-600 font-bold text-sm">✓ 正確答案</span>';
                    } else if (isSelected && key !== q.answer) {
                        extraBadge = '<span class="text-red-500 font-bold text-sm">✕ 您的作答</span>';
                    }
                }

                btn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm ${userAns !== undefined && (key === q.answer || isSelected) ? (key === q.answer ? 'bg-emerald-600 text-white' : 'bg-red-500 text-white') : 'bg-slate-100 text-slate-600'}">${key}</span>
                        <span class="text-base">${val}</span>
                    </div>
                    ${extraBadge}
                `;
                btn.onclick = () => selectOption(key);
                container.appendChild(btn);
            });

            // 即時解析區塊控制
            const feedbackContainer = document.getElementById('feedback-container');
            if (userAns !== undefined) {
                feedbackContainer.classList.remove('hidden');
                const isCorrect = userAns === q.answer;

                feedbackContainer.innerHTML = `
                    <div class="flex items-center space-x-2 font-bold mb-2 text-base">
                        <span>${isCorrect ? '🎉 答對了！' : '❌ 答錯了！'}</span>
                        <span class="text-xs px-2 py-0.5 rounded ${isCorrect ? 'bg-emerald-200 text-emerald-800' : 'bg-red-200 text-red-800'}">正確答案：${q.answer}</span>
                    </div>
                    <p class="text-sm leading-relaxed mb-2">${q.explanation}</p>
                    <div class="text-xs opacity-75 font-medium">📖 參考課本頁碼：第 ${q.textbook_page} 頁</div>
                `;
            } else {
                feedbackContainer.classList.add('hidden');
            }

            // 按鈕狀態控制
            document.getElementById('prev-btn').disabled = quizState.currentIndex === 0;
            const isLast = quizState.currentIndex === total - 1;
            document.getElementById('next-btn').classList.toggle('hidden', isLast);
            document.getElementById('submit-btn').classList.toggle('hidden', !isLast);
        }

        // 選擇選項
        function selectOption(optionKey) {
            if (quizState.userAnswers[quizState.currentIndex] !== undefined) return;
            quizState.userAnswers[quizState.currentIndex] = optionKey;
            renderQuestion();
        }

        // 上一題 / 下一題導航
        function prevQuestion() {
            if (quizState.currentIndex > 0) {
                quizState.currentIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (quizState.currentIndex < quizState.questions.length - 1) {
                quizState.currentIndex++;
                renderQuestion();
            }
        }

        // 確認交卷提示或直接交卷
        function confirmSubmit() {
            const answeredCount = Object.keys(quizState.userAnswers).length;
            const totalCount = quizState.questions.length;
            if (answeredCount < totalCount) {
                if (!confirm(`您還有 ${totalCount - answeredCount} 題尚未作答，確定要直接交卷嗎？`)) {
                    return;
                }
            }
            submitQuiz();
        }

        // 計算分數與顯示結果
        function submitQuiz() {
            clearInterval(quizState.timerInterval);
            quizState.isSubmitted = true;

            let correctCount = 0;
            const total = quizState.questions.length;
            const mistakes = [];

            quizState.questions.forEach((q, idx) => {
                const userAns = quizState.userAnswers[idx];
                if (userAns === q.answer) {
                    correctCount++;
                } else {
                    mistakes.push({
                        ...q,
                        userAnswer: userAns !== undefined ? userAns : '未作答'
                    });
                }
            });

            // 總分計算（滿分100分，按比例平均分配）
            const score = Math.round((correctCount / total) * 100);
            const accuracy = Math.round((correctCount / total) * 100);

            // 更新結果介面
            document.getElementById('final-score').textContent = score;
            document.getElementById('correct-count-text').textContent = `${correctCount} / ${total}`;
            document.getElementById('accuracy-rate-text').textContent = `${accuracy}%`;

            const mins = String(Math.floor(quizState.elapsedSeconds / 60)).padStart(2, '0');
            const secs = String(quizState.elapsedSeconds % 60).padStart(2, '0');
            document.getElementById('total-time-text').textContent = `${mins}:${secs}`;

            // 渲染錯題大鍋菜
            renderMistakes(mistakes);

            // 切換畫面
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('timer-container').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 渲染錯題大鍋菜彙整
        function renderMistakes(mistakes) {
            const container = document.getElementById('mistakes-container');
            const badge = document.getElementById('mistake-badge');
            badge.textContent = `錯題數：${mistakes.length}`;

            container.innerHTML = '';

            if (mistakes.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-emerald-50 rounded-2xl border border-emerald-100">
                        <div class="text-4xl mb-2">🏆</div>
                        <h4 class="text-lg font-bold text-emerald-800">太神啦！全數答對！</h4>
                        <p class="text-sm text-emerald-600 mt-1">您對農概第7章園藝的觀念掌握得非常透徹，完全沒有錯題！</p>
                    </div>
                `;
                return;
            }

            mistakes.forEach((m, idx) => {
                const div = document.createElement('div');
                div.className = "bg-slate-50 border border-slate-200 rounded-2xl p-5 md:p-6 space-y-4 shadow-sm";
                div.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-center space-x-2">
                            <span class="px-2.5 py-1 bg-red-100 text-red-800 font-bold rounded-lg text-xs">錯題 #${idx + 1} (原題號 #${m.number})</span>
                            <span class="text-xs text-slate-400 font-medium">教科書 P.${m.textbook_page}</span>
                        </div>
                    </div>
                    <div class="font-bold text-slate-900 text-base md:text-lg">
                        ${m.question}
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm bg-white p-3 rounded-xl border border-slate-100">
                        <div class="flex items-center space-x-2">
                            <span class="text-slate-500 font-medium">您的作答：</span>
                            <span class="px-2 py-0.5 rounded font-bold ${m.userAnswer === '未作答' ? 'bg-amber-100 text-amber-800' : 'bg-red-100 text-red-800'}">${m.userAnswer}</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-slate-500 font-medium">正確答案：</span>
                            <span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 font-bold rounded">${m.answer}</span>
                        </div>
                    </div>
                    <div class="space-y-1 bg-emerald-50/60 p-4 rounded-xl border border-emerald-100/80">
                        <div class="text-xs font-bold text-emerald-800 uppercase tracking-wider flex items-center space-x-1">
                            <span>💡 依據[農概第7章課本]詳盡解析</span>
                        </div>
                        <p class="text-sm text-slate-700 leading-relaxed mt-1">${m.explanation}</p>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // 重新測驗
        function restartQuiz() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 捲動至錯題
        function scrollToMistakes() {
            document.getElementById('mistakes-container').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
